<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>Ronen AI Agency — משימה חדשה</title>
  <link rel="stylesheet" href="app.css?v=1">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
  <main id="team" class="view">
    <header class="top">
      <div class="brand">Ronen AI Agency</div>
      <h1>למי המשימה?</h1>
    </header>
    <div id="grid" class="grid" aria-live="polite"></div>
    <p class="hint">קבצים (PDF / Word) — שולחים בצ'אט לפני המשימה, והם יצורפו אליה.</p>
  </main>

  <main id="compose" class="view" hidden>
    <button id="back" class="back" type="button">→ כל הצוות</button>
    <div class="who">
      <img id="who-photo" alt="">
      <div>
        <div id="who-name" class="who-name"></div>
        <div id="who-role" class="who-role"></div>
      </div>
    </div>
    <label class="sr" for="task">המשימה</label>
    <textarea id="task" rows="7"></textarea>
    <div class="meta"><span id="count"></span></div>
    <button id="send" class="send" type="button" hidden>שליחה</button>
  </main>

  <script src="app.js?v=1"></script>
</body>
</html>
